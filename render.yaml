services:
  - type: web
    name: rag-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: rag-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: BACKEND_URL
        sync: false
