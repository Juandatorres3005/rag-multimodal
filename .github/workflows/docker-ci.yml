name: Integración Continua (Docker Build)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Crear archivo .env de prueba
      run: |
        echo "GEMINI_API_KEY=test_key_ci" > .env

    - name: Validar y construir contenedores con Docker Compose
      run: |
        docker compose build

    - name: Verificar estado de las imágenes
      run: |
        docker images